<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="#0d1b2a" stroke="#00b4d8" stroke-width="2.5"/>
  <!-- Dashed inner orbit -->
  <circle cx="50" cy="50" r="38" fill="#0d1b2a" stroke="#00b4d8" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <!-- Brain lobe shape -->
  <path d="M50 18 Q32 14 24 30 Q15 44 28 55 Q23 67 34 72 Q46 78 50 74 Q54 78 66 72 Q77 67 72 55 Q85 44 76 30 Q68 14 50 18 Z" fill="#023e8a" stroke="#00b4d8" stroke-width="1.2"/>
  <!-- Neural nodes -->
  <circle cx="40" cy="36" r="3.5" fill="#00b4d8"/>
  <circle cx="60" cy="36" r="3.5" fill="#00b4d8"/>
  <circle cx="35" cy="54" r="2.5" fill="#90e0ef"/>
  <circle cx="65" cy="54" r="2.5" fill="#90e0ef"/>
  <circle cx="50" cy="63" r="3.5" fill="#00b4d8"/>
  <!-- Neural connections -->
  <line x1="40" y1="36" x2="60" y2="36" stroke="#90e0ef" stroke-width="0.8"/>
  <line x1="40" y1="36" x2="35" y2="54" stroke="#90e0ef" stroke-width="0.8"/>
  <line x1="60" y1="36" x2="65" y2="54" stroke="#90e0ef" stroke-width="0.8"/>
  <line x1="35" y1="54" x2="50" y2="63" stroke="#90e0ef" stroke-width="0.8"/>
  <line x1="65" y1="54" x2="50" y2="63" stroke="#90e0ef" stroke-width="0.8"/>
  <!-- Crosshair ticks -->
  <line x1="50" y1="2" x2="50" y2="10" stroke="#00b4d8" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="50" y2="98" stroke="#00b4d8" stroke-width="1.5"/>
  <line x1="2" y1="50" x2="10" y2="50" stroke="#00b4d8" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="98" y2="50" stroke="#00b4d8" stroke-width="1.5"/>
</svg>
